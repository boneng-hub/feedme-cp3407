<!DOCTYPE html>
<html>
<head>
  <title>My Orders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <span class="navbar-brand fw-semibold">FeedMe</span>
    <div class="d-flex gap-2">
      <a href="restaurants.html" class="btn btn-outline-secondary btn-sm">Order a Meal</a>
      <button onclick="logout()" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-3">My Orders</h1>
          <div id="orders" class="d-grid gap-3"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="common.js"></script>
<script>
const token = localStorage.getItem("token");

if (!token) {
  alert("Please login first!");
  window.location.href = "/login.html";
}
</script>
<script>
function toCurrency(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) {
    return '0.00';
  }
  return n.toFixed(2);
}

async function reorder(order) {
  const token = localStorage.getItem('token');
  const items = (order.items || []).map(item => ({
    name: item.name,
    price: Number(item.price),
    quantity: Number(item.quantity)
  }));

  if (items.length === 0) {
    alert('This order has no item details to reorder.');
    return;
  }

  const total = items.reduce((sum, item) => sum + item.price * item.quantity, 0);

  try {
    const res = await fetch(API_BASE + '/api/orders', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({
        restaurant_id: Number(order.restaurant_id),
        total_price: total,
        items
      })
    });

    const data = await res.json();

    if (handleAuthFailure(res.status)) {
      return;
    }

    if (!res.ok) {
      alert(data.error || data.message || 'Reorder failed');
      return;
    }

    alert('Reorder placed! New Order ID: ' + data.orderId);
    loadOrders();
  } catch (err) {
    console.error(err);
    alert('Network error, please try again later');
  }
}

async function loadOrders() {
  const token = localStorage.getItem("token");

  try {
    const res = await fetch(API_BASE + '/api/my-orders', {
      headers: {
        'Authorization': 'Bearer ' + token
      }
    });

    const data = await res.json();

    if (handleAuthFailure(res.status)) {
      return;
    }

    const list = document.getElementById('orders');
    list.innerHTML = '';

    if (!res.ok) {
      alert(data.error || data.message || 'Failed to load orders');
      return;
    }

    if (data.length === 0) {
      list.innerHTML = '<div class="alert alert-secondary mb-0">No orders yet.</div>';
      return;
    }

    data.forEach(order => {
      const card = document.createElement('div');
      card.className = 'card border';

      const items = (order.items || [])
        .map(item => '<li class="list-group-item d-flex justify-content-between"><span>' + item.name + '</span><span>$' + toCurrency(item.price) + ' x' + item.quantity + '</span></li>')
        .join('');

      const canReorder = Number.isInteger(Number(order.restaurant_id)) && Number(order.restaurant_id) > 0 && (order.items || []).length > 0;

      card.innerHTML =
        '<div class="card-body">' +
        '<div class="d-flex justify-content-between align-items-center mb-2">' +
        '<h2 class="h6 mb-0">Order #' + order.id + '</h2>' +
        '<span class="badge text-bg-primary">$' + toCurrency(order.total_price) + '</span>' +
        '</div>' +
        '<ul class="list-group list-group-flush">' + (items || '<li class="list-group-item text-muted">No item details</li>') + '</ul>' +
        '<div class="mt-3 d-flex justify-content-end">' +
        '<button class="btn btn-sm btn-success" data-role="reorder" ' + (canReorder ? '' : 'disabled') + '>Reorder</button>' +
        '</div>' +
        '</div>';

      const reorderButton = card.querySelector('[data-role="reorder"]');
      if (reorderButton && canReorder) {
        reorderButton.addEventListener('click', () => reorder(order));
      }

      list.appendChild(card);
    });
  } catch (err) {
    console.error(err);
    alert('Network error, please try again later');
  }
}

loadOrders();
</script>
</body>
</html>
