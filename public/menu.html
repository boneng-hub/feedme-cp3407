<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <span class="navbar-brand fw-semibold">FeedMe</span>
        <div class="d-flex gap-2">
            <a href="restaurants.html" class="btn btn-outline-secondary btn-sm">Back to Restaurants</a>
            <a href="my-orders.html" class="btn btn-outline-primary btn-sm">My Orders</a>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row g-3 justify-content-center">
        <div class="col-12 col-lg-7">
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h1 class="h4 mb-3">Menu</h1>
                    <ul id="menu" class="list-group"></ul>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-3">Your Cart</h2>
                    <ul id="cart-items" class="list-group mb-3"></ul>
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                    <h3 class="h6 mb-0">Total: $<span id="total" class="badge text-bg-dark">0.00</span></h3>
                    <button class="btn btn-success" onclick="placeOrder()">Place Order</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="common.js"></script>
<script>
const restaurantId = localStorage.getItem("restaurantId");
const token = localStorage.getItem("token");

let cart = [];

function addToCart(item) {
    const existing = cart.find(i => i.id === item.id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({ ...item, quantity: 1 });
    }

    updateTotal();
    renderCart();
}

function removeFromCart(itemId) {
    cart = cart.filter(item => item.id !== itemId);
    updateTotal();
    renderCart();
}

function changeQuantity(itemId, delta) {
    const target = cart.find(item => item.id === itemId);
    if (!target) {
        return;
    }

    target.quantity += delta;

    if (target.quantity <= 0) {
        removeFromCart(itemId);
        return;
    }

    updateTotal();
    renderCart();
}

function renderCart() {
    const cartList = document.getElementById('cart-items');
    cartList.innerHTML = '';

    if (cart.length === 0) {
        const li = document.createElement('li');
        li.className = 'list-group-item text-muted';
        li.innerText = 'Your cart is empty.';
        cartList.appendChild(li);
        return;
    }

    cart.forEach(item => {
        const subtotal = Number(item.price) * item.quantity;
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';
        li.innerHTML =
            '<div>' +
            '<div class="fw-semibold">' + item.name + '</div>' +
            '<div class="text-muted small">$' + item.price + ' x ' + item.quantity + ' = $' + subtotal.toFixed(2) + '</div>' +
            '</div>';

        const controls = document.createElement('div');
        controls.className = 'btn-group btn-group-sm';

        const minusBtn = document.createElement('button');
        minusBtn.className = 'btn btn-outline-secondary';
        minusBtn.innerText = '-';
        minusBtn.onclick = () => changeQuantity(item.id, -1);

        const qtyBtn = document.createElement('button');
        qtyBtn.className = 'btn btn-light disabled';
        qtyBtn.innerText = String(item.quantity);

        const plusBtn = document.createElement('button');
        plusBtn.className = 'btn btn-outline-secondary';
        plusBtn.innerText = '+';
        plusBtn.onclick = () => changeQuantity(item.id, 1);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'btn btn-outline-danger';
        removeBtn.innerText = 'x';
        removeBtn.onclick = () => removeFromCart(item.id);

        controls.appendChild(minusBtn);
        controls.appendChild(qtyBtn);
        controls.appendChild(plusBtn);
        controls.appendChild(removeBtn);

        li.appendChild(controls);
        cartList.appendChild(li);
    });
}

function updateTotal() {
    let total = 0;

    cart.forEach(item => {
        total += Number(item.price) * item.quantity;
    });

    document.getElementById('total').innerText = total.toFixed(2);
}

if (!token) {
    alert("Please login first!");
    window.location.href = "/login.html";
}

if (!restaurantId) {
    alert("Please select a restaurant first!");
    window.location.href = "/restaurants.html";
}

async function loadMenu() {
    try {
        const res = await fetch(API_BASE + '/api/menu/' + restaurantId);
        if (handleAuthFailure(res.status)) {
            return;
        }

        if (!res.ok) {
            throw new Error('Failed to load menu: HTTP ' + res.status);
        }

        const data = await res.json();
        const list = document.getElementById('menu');
        list.innerHTML = '';

        if (data.length === 0) {
            const li = document.createElement('li');
            li.className = 'list-group-item text-muted';
            li.innerText = 'No menu items available for this restaurant yet.';
            list.appendChild(li);
            return;
        }

        data.forEach(item => {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = '<span><span class="fw-semibold">' + item.name + '</span> <span class="text-muted">$' + item.price + '</span></span>';

            const btn = document.createElement('button');
            btn.innerText = 'Add';
            btn.className = 'btn btn-primary btn-sm';

            btn.onclick = () => {
                addToCart(item);
            };

            li.appendChild(btn);
            list.appendChild(li);
        });
    } catch (err) {
        console.error(err);
        alert('Failed to load menu');
    }
}

async function placeOrder() {
    if (cart.length === 0) {
        alert('Please add at least one menu item');
        return;
    }

    const total = cart.reduce((sum, item) => sum + Number(item.price) * item.quantity, 0);

    try {
        const res = await fetch(API_BASE + '/api/orders', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
                restaurant_id: Number(restaurantId),
                total_price: total,
                items: cart
            })
        });

        const data = await res.json();

        if (handleAuthFailure(res.status)) {
            return;
        }

        if (!res.ok) {
            alert(data.error || data.message || 'Failed to create order');
            return;
        }

        alert('Order created! ID: ' + data.orderId);
        cart = [];
        updateTotal();
        renderCart();
    } catch (err) {
        console.error(err);
        alert('Network error, please try again later');
    }
}

loadMenu();
renderCart();
</script>
</body>
</html>
