<!DOCTYPE html>
<html>

<head>
    <title>FeedMe Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4 text-center">FeedMe Login</h1>

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input id="username" class="form-control" placeholder="Enter username">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input id="password" type="password" class="form-control" placeholder="Enter password">
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn btn-primary" onclick="login()">Login</button>
                        <a href="register.html" class="btn btn-outline-primary">Create Account</a>
                        <a href="index.html" class="btn btn-outline-secondary">Back Home</a>
                    </div>

                    <p id="msg" class="mt-3 mb-0 text-center text-danger"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="common.js"></script>
<script src="script.js"></script>
</body>

</html>
