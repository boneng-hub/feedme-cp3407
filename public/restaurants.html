<!DOCTYPE html>
<html>
<head>
  <title>Restaurants</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <span class="navbar-brand fw-semibold">FeedMe</span>
    <div class="d-flex gap-2">
      <a href="my-orders.html" class="btn btn-outline-primary btn-sm">My Orders</a>
      <button onclick="logout()" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-3">Restaurant List</h1>
          <p class="text-muted small mb-3">Click a restaurant to open its menu.</p>
          <ul id="list" class="list-group"></ul>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="common.js"></script>
<script>
const token = localStorage.getItem("token");

if (!token) {
  alert("Please login first!");
  window.location.href = "/login.html";
}
</script>
<script>
async function loadRestaurants() {
  try {
    const res = await fetch(API_BASE + '/api/restaurants');
    if (handleAuthFailure(res.status)) {
      return;
    }

    if (!res.ok) {
      throw new Error('Failed to load restaurants: HTTP ' + res.status);
    }

    const data = await res.json();

    const list = document.getElementById('list');
    list.innerHTML = '';

    data.forEach(r => {
      const li = document.createElement('li');
      li.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
      li.style.cursor = 'pointer';
      li.innerHTML = '<span class="fw-semibold">' + r.name + '</span><span class="text-muted small">' + r.location + '</span>';

      li.onclick = () => {
        localStorage.setItem('restaurantId', r.id);
        window.location.href = "/menu.html";
      };

      list.appendChild(li);
    });
  } catch (err) {
    console.error(err);
    alert('无法加载餐厅列表。请确认后端已启动并可访问 http://localhost:3000');
  }
}

loadRestaurants();
</script>
</body>
</html>
