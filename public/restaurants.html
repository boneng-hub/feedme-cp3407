<!DOCTYPE html>
<html>
<head>
  <title>Restaurants</title>
</head>
<body>

<h1>Restaurant List</h1>

<ul id="list"></ul>
<button onclick="createOrder()">Place Order</button>
<script>
const API_BASE = window.location.origin.startsWith('http')
  ? window.location.origin
  : 'http://localhost:3000';

async function loadRestaurants() {
  try {
    const res = await fetch(API_BASE + '/api/restaurants');
    if (!res.ok) {
      throw new Error('Failed to load restaurants: HTTP ' + res.status);
    }

    const data = await res.json();

    const list = document.getElementById('list');
    list.innerHTML = '';

    data.forEach(r => {
      const li = document.createElement('li');
      li.innerText = r.name + ' - ' + r.location;

      li.onclick = () => {
        localStorage.setItem('restaurantId', String(r.id));
        alert('Selected: ' + r.name);
      };

      list.appendChild(li);
    });
  } catch (err) {
    console.error(err);
    alert('无法加载餐厅列表。请确认后端已启动并可访问 http://localhost:3000');
  }
}

loadRestaurants();
</script>
<script>
async function createOrder() {
  const restaurantId = localStorage.getItem('restaurantId');

  if (!restaurantId) {
    alert('Please select a restaurant first!');
    return;
  }

  try {
    const res = await fetch(API_BASE + '/api/orders', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        restaurant_id: Number(restaurantId),
        total_price: 20.0
      })
    });

    if (!res.ok) {
      throw new Error('Failed to create order: HTTP ' + res.status);
    }

    const data = await res.json();
    alert('Order created! ID: ' + data.orderId);
  } catch (err) {
    console.error(err);
    alert('下单失败。请检查后端是否运行、数据库是否有 orders 表。');
  }
}
</script>
</body>
</html>
